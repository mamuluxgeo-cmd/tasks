<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task System</title>

<style>
*{
  box-sizing:border-box;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  margin:0;
  background:#0f172a;
  color:#fff;
}

.app{
  max-width:520px;
  margin:auto;
  padding:14px;
  padding-bottom:40px;
}

.card,.task,.stat{
  background:#1e293b;
  border:1px solid #334155;
  padding:15px;
  border-radius:18px;
  margin-bottom:12px;
}

h2,h3,h4,p{
  margin-top:0;
}

input,select,textarea{
  width:100%;
  padding:13px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid #475569;
  background:#334155;
  color:#fff;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:13px;
  font-weight:800;
  background:#2563eb;
  color:#fff;
  font-size:15px;
}

button.red{
  background:#ef4444;
}

.topbar{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.topbar button{
  width:auto;
  padding:10px 14px;
  margin:0;
}

.small{
  font-size:13px;
  color:#94a3b8;
  line-height:1.5;
}

.task.overdue{
  border:2px solid #ef4444;
  background:#2a1820;
}

.task.completed{
  border:2px solid #22c55e;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  background:#334155;
  margin-top:6px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px;
}

.stat{
  margin:0;
  text-align:center;
}

.stat b{
  display:block;
  font-size:24px;
  margin-top:5px;
}

.hidden{
  display:none;
}

hr{
  border:none;
  border-top:1px solid #334155;
  margin:18px 0;
}

#msg{
  margin-top:10px;
  color:#fca5a5;
}
</style>
</head>

<body>

<div class="app">

  <div id="auth">
    <div class="card">
      <h2>Task System</h2>
      <p class="small">თანამშრომლების დავალებების მართვის სისტემა</p>

      <h4>შესვლა</h4>
      <input id="loginPhone" placeholder="ტელეფონი / admin">
      <input id="loginPassword" placeholder="პაროლი / 1234" type="password">
      <button onclick="login()">შესვლა</button>

      <hr>

      <h4>რეგისტრაცია</h4>
      <input id="regName" placeholder="სახელი და გვარი">
      <input id="regPhone" placeholder="ტელეფონი">
      <input id="regPassword" placeholder="პაროლი" type="password">
      <input id="regPosition" placeholder="პოზიცია">
      <button onclick="registerUser()">რეგისტრაცია</button>

      <p id="msg"></p>
    </div>
  </div>

  <div id="dash" class="hidden">

    <div class="topbar">
      <div>
        <h3 id="username"></h3>
        <div id="userrole" class="small"></div>
      </div>
      <button class="red" onclick="logout()">გასვლა</button>
    </div>

    <div id="adminStats" class="hidden">
      <h4>ადმინის სტატისტიკა</h4>

      <div class="stats">
        <div class="stat">
          სულ
          <b id="statAll">0</b>
        </div>
        <div class="stat">
          ახალი
          <b id="statNew">0</b>
        </div>
        <div class="stat">
          პროცესში
          <b id="statProgress">0</b>
        </div>
        <div class="stat">
          ვადაგადაცილებული
          <b id="statOverdue">0</b>
        </div>
        <div class="stat">
          დასრულებული
          <b id="statCompleted">0</b>
        </div>
        <div class="stat">
          პრობლემა
          <b id="statProblem">0</b>
        </div>
      </div>
    </div>

    <div class="card">
      <h4>დავალების შექმნა</h4>

      <input id="title" placeholder="დავალების სათაური">
      <textarea id="desc" placeholder="დავალების აღწერა"></textarea>

      <label class="small">შემსრულებელი</label>
      <select id="users"></select>

      <label class="small">პრიორიტეტი</label>
      <select id="priority">
        <option value="low">დაბალი</option>
        <option value="normal" selected>ჩვეულებრივი</option>
        <option value="high">მაღალი</option>
        <option value="urgent">სასწრაფო</option>
      </select>

      <label class="small">შესრულების ვადა</label>
      <input id="deadline" type="datetime-local">

      <button onclick="createTask()">დავალების შექმნა</button>
    </div>

    <h4>დავალებები</h4>
    <div id="tasks"></div>

  </div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwkkhmujGNq5iF-esZVKwR2hkMRApMuSzFvr0HKdqJ1uToJvOOvgC0JVA17iMQu4Ler/exec";

let currentUser = null;
let allTasks = [];

async function api(data){
  try{
    const res = await fetch(API,{
      method:"POST",
      body:JSON.stringify(data)
    });
    return await res.json();
  }catch(e){
    return {success:false,error:"სერვერთან კავშირი ვერ მოხერხდა"};
  }
}

function isAdmin(){
  return currentUser &&
    (currentUser.Role === "super_admin" || currentUser.Role === "admin");
}

async function login(){
  const phone = document.getElementById("loginPhone").value.trim();
  const password = document.getElementById("loginPassword").value.trim();

  if(!phone || !password){
    msg.innerText = "ტელეფონი და პაროლი აუცილებელია";
    return;
  }

  const res = await api({
    action:"login",
    phone,
    password
  });

  if(!res.success){
    msg.innerText = res.error || "შესვლა ვერ შესრულდა";
    return;
  }

  currentUser = res.user;
  localStorage.setItem("taskUser",JSON.stringify(currentUser));
  init();
}

async function registerUser(){
  const name = document.getElementById("regName").value.trim();
  const phone = document.getElementById("regPhone").value.trim();
  const password = document.getElementById("regPassword").value.trim();
  const position = document.getElementById("regPosition").value.trim();

  if(!name || !phone || !password || !position){
    msg.innerText = "ყველა ველის შევსება აუცილებელია";
    return;
  }

  const res = await api({
    action:"register",
    name,
    phone,
    password,
    position
  });

  if(!res.success){
    msg.innerText = res.error || "რეგისტრაცია ვერ შესრულდა";
    return;
  }

  msg.style.color = "#86efac";
  msg.innerText = "რეგისტრაცია წარმატებით დასრულდა. ახლა შედი სისტემაში.";
  document.getElementById("loginPhone").value = phone;
}

function logout(){
  localStorage.removeItem("taskUser");
  location.reload();
}

async function init(){
  document.getElementById("auth").style.display = "none";
  document.getElementById("dash").classList.remove("hidden");

  username.innerText = currentUser.Name;
  userrole.innerText = currentUser.Position + " / " + currentUser.Role;

  if(isAdmin()){
    adminStats.classList.remove("hidden");
  }else{
    adminStats.classList.add("hidden");
  }

  await loadUsers();
  await loadTasks();
}

async function loadUsers(){
  const res = await api({
    action:"getUsers",
    userId:currentUser.ID
  });

  users.innerHTML = "";

  if(!res.success){
    users.innerHTML = "<option>თანამშრომლები ვერ ჩაიტვირთა</option>";
    return;
  }

  res.users.forEach(u=>{
    const opt = document.createElement("option");
    opt.value = u.ID;
    opt.innerText = u.Name + " — " + u.Position;
    users.appendChild(opt);
  });
}

async function createTask(){
  const titleVal = title.value.trim();
  const descVal = desc.value.trim();
  const assigned = users.value;
  const priorityVal = priority.value;
  const deadlineVal = deadline.value;

  if(!titleVal || !descVal || !assigned || !deadlineVal){
    alert("ყველა ველის შევსება აუცილებელია");
    return;
  }

  const res = await api({
    action:"createTask",
    userId:currentUser.ID,
    title:titleVal,
    description:descVal,
    assignedTo:[assigned],
    priority:priorityVal,
    deadline:deadlineVal
  });

  if(!res.success){
    alert(res.error || "დავალება ვერ შეიქმნა");
    return;
  }

  title.value = "";
  desc.value = "";
  deadline.value = "";

  await loadTasks();
}

async function loadTasks(){
  const res = await api({
    action:"getTasks",
    userId:currentUser.ID
  });

  tasks.innerHTML = "";

  if(!res.success){
    tasks.innerHTML = "<div class='card'>დავალებები ვერ ჩაიტვირთა</div>";
    return;
  }

  allTasks = res.tasks || [];

  renderStats();
  renderTasks();
}

function renderStats(){
  if(!isAdmin()) return;

  statAll.innerText = allTasks.length;
  statNew.innerText = allTasks.filter(t=>t.Status==="new").length;
  statProgress.innerText = allTasks.filter(t=>t.Status==="in_progress").length;
  statOverdue.innerText = allTasks.filter(t=>t.Status==="overdue").length;
  statCompleted.innerText = allTasks.filter(t=>t.Status==="completed").length;
  statProblem.innerText = allTasks.filter(t=>t.Status==="problem").length;
}

function renderTasks(){
  if(allTasks.length === 0){
    tasks.innerHTML = "<div class='card'>დავალება ჯერ არ არის</div>";
    return;
  }

  allTasks.forEach(t=>{
    const div = document.createElement("div");
    div.className = "task";

    if(t.Status === "overdue") div.classList.add("overdue");
    if(t.Status === "completed") div.classList.add("completed");

    div.innerHTML = `
      <b>${t.Title}</b>
      <p class="small">${t.Description}</p>

      <div class="small">შემქმნელი: ${t.CreatedByName || "-"}</div>
      <div class="small">შემსრულებელი: ${t.AssignedNames || "-"}</div>
      <div class="small">ვადა: ${t.Deadline || "-"}</div>
      <div class="small">პრიორიტეტი: ${t.Priority || "-"}</div>

      <span class="badge">სტატუსი: ${statusName(t.Status)}</span>

      ${t.CompletedByName ? `<div class="small">დაასრულა: ${t.CompletedByName}</div>` : ""}

      <select onchange="changeStatus('${t.ID}',this.value)">
        <option value="">სტატუსის შეცვლა</option>
        <option value="new">ახალი</option>
        <option value="in_progress">პროცესში</option>
        <option value="problem">პრობლემა</option>
        <option value="completed">დასრულებული</option>
        <option value="closed">დახურვა</option>
      </select>
    `;

    tasks.appendChild(div);
  });
}

function statusName(status){
  const map = {
    new:"ახალი",
    in_progress:"პროცესში",
    problem:"პრობლემა",
    completed:"დასრულებული",
    overdue:"ვადაგადაცილებული",
    closed:"დახურული"
  };

  return map[status] || status;
}

async function changeStatus(taskId,status){
  if(!status) return;

  const res = await api({
    action:"updateTaskStatus",
    userId:currentUser.ID,
    taskId,
    status
  });

  if(!res.success){
    alert(res.error || "სტატუსი ვერ შეიცვალა");
    return;
  }

  await loadTasks();
}

window.onload = function(){
  const saved = localStorage.getItem("taskUser");

  if(saved){
    currentUser = JSON.parse(saved);
    init();
  }
};
</script>

</body>
</html>
