<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task System</title>

<style>
*{box-sizing:border-box;font-family:sans-serif;}
body{margin:0;background:#0f172a;color:#fff;}
.app{max-width:500px;margin:auto;padding:15px;}

.card{
background:#1e293b;
padding:15px;
border-radius:18px;
margin-bottom:12px;
}

input,select,textarea{
width:100%;
padding:12px;
margin-top:8px;
border-radius:10px;
border:none;
background:#334155;
color:#fff;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
font-weight:bold;
background:#2563eb;
color:#fff;
}

.task{
background:#1e293b;
padding:12px;
border-radius:14px;
margin-top:10px;
}

.red{border:2px solid #ef4444;}
.green{border:2px solid #22c55e;}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.small{font-size:12px;color:#94a3b8;}
</style>
</head>

<body>

<div class="app">

<!-- AUTH -->
<div id="auth">

<h2>Task System</h2>

<input id="phone" placeholder="ტელეფონი">
<input id="pass" placeholder="პაროლი" type="password">

<button onclick="login()">შესვლა</button>

<hr>

<input id="name" placeholder="სახელი გვარი">
<input id="rphone" placeholder="ტელეფონი">
<input id="rpass" placeholder="პაროლი">
<input id="pos" placeholder="პოზიცია">

<button onclick="register()">რეგისტრაცია</button>

<p id="msg"></p>

</div>

<!-- DASHBOARD -->
<div id="dash" style="display:none">

<div class="topbar">
<h3 id="username"></h3>
<button onclick="logout()">გასვლა</button>
</div>

<div class="card">

<h4>დავალების შექმნა</h4>

<input id="title" placeholder="სათაური">
<textarea id="desc" placeholder="აღწერა"></textarea>

<select id="users"></select>

<select id="priority">
<option value="low">Low</option>
<option value="normal">Normal</option>
<option value="high">High</option>
<option value="urgent">Urgent</option>
</select>

<input id="deadline" type="datetime-local">

<button onclick="createTask()">შექმნა</button>

</div>

<div id="tasks"></div>

</div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwkkhmujGNq5iF-esZVKwR2hkMRApMuSzFvr0HKdqJ1uToJvOOvgC0JVA17iMQu4Ler/exec";

let currentUser = null;

async function api(data){
const res = await fetch(API,{method:"POST",body:JSON.stringify(data)});
return await res.json();
}

async function login(){
let phone=document.getElementById("phone").value;
let password=document.getElementById("pass").value;

let res=await api({action:"login",phone,password});

if(!res.success){
msg.innerText=res.error;
return;
}

currentUser=res.user;
localStorage.setItem("user",JSON.stringify(res.user));

init();
}

async function register(){
let name=nameInput.value;
let phone=rphone.value;
let password=rpass.value;
let position=pos.value;

let res=await api({action:"register",name,phone,password,position});

msg.innerText=res.success?"OK":"ERROR";
}

function logout(){
localStorage.clear();
location.reload();
}

async function init(){
auth.style.display="none";
dash.style.display="block";

username.innerText=currentUser.Name;

await loadUsers();
await loadTasks();
}

async function loadUsers(){
let res=await api({action:"getUsers",userId:currentUser.ID});

users.innerHTML="";

res.users.forEach(u=>{
let opt=document.createElement("option");
opt.value=u.ID;
opt.innerText=u.Name;
users.appendChild(opt);
});
}

async function createTask(){
let titleVal=title.value;
let descVal=desc.value;
let assigned=users.value;
let priorityVal=priority.value;
let deadlineVal=deadline.value;

let res=await api({
action:"createTask",
userId:currentUser.ID,
title:titleVal,
description:descVal,
assignedTo:[assigned],
priority:priorityVal,
deadline:deadlineVal
});

if(res.success){
title.value="";
desc.value="";
loadTasks();
}
}

async function loadTasks(){
let res=await api({action:"getTasks",userId:currentUser.ID});

tasks.innerHTML="";

res.tasks.forEach(t=>{

let div=document.createElement("div");
div.className="task";

if(t.Status==="overdue") div.classList.add("red");
if(t.Status==="completed") div.classList.add("green");

div.innerHTML=`
<b>${t.Title}</b><br>
<span class="small">${t.Description}</span><br><br>

Assigned: ${t.AssignedNames}<br>
Deadline: ${t.Deadline}<br>
Status: ${t.Status}<br><br>

<select onchange="changeStatus('${t.ID}',this.value)">
<option value="new">new</option>
<option value="in_progress">in_progress</option>
<option value="completed">completed</option>
<option value="closed">closed</option>
</select>
`;

tasks.appendChild(div);

});
}

async function changeStatus(id,status){
await api({
action:"updateTaskStatus",
userId:currentUser.ID,
taskId:id,
status:status
});

loadTasks();
}

window.onload=function(){
let saved=localStorage.getItem("user");
if(saved){
currentUser=JSON.parse(saved);
init();
}
};
</script>

</body>
</html>
